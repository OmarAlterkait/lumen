[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "lumen"
dynamic = ["version"]
description = "Differentiable optical-photon simulation for neutrino detectors, in JAX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Omar Alterkait" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "numpy>=1.24",
    # jax is pinned exactly: docs/dev/decisions.md, 7 (0.5.3's CPU runtime missed faces with the persistent cache on;
    # tallymap v0.8.2 is tested on 0.6.2)
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "scipy>=1.10",  # spatial search of sibling placements (scipy.spatial.cKDTree) in the geometry lowering
    "pyyaml>=6",  # detectors written in YAML (lumen.format.yaml), read at conversion only
    "tallymap @ git+https://github.com/OmarAlterkait/tallymap.git@v0.8.2",  # tallymap v0.8.2 (not on PyPI)
]

[project.optional-dependencies]
# the GPU: JAX's CUDA plugin and NVRTC, the compiler tallymap's kernel backend uses on a GPU (tallymap's own cuda
# extra is jax[cuda12] too)
cuda = ["jax[cuda12]==0.6.2"]
# lumen.tools.plot (the notebooks' figures)
plot = ["matplotlib>=3.7"]
# the GDML viewer (python -m lumen.viewer): the booleans of the solids' display meshes
view = ["manifold3d>=3.0,<4"]
# the unit tests run on several workers (pytest -n 4; docs/dev/README.md): pytest-xdist and its transport execnet;
# matplotlib for lumen.tools.plot's tests; the viewer's manifold3d for its own
test = ["pytest>=8", "pytest-xdist>=3.6,<4", "execnet>=2.1,<3", "matplotlib>=3.7", "lumen[view]"]
dev = ["lumen[test]", "ruff>=0.8,<0.9", "mypy>=1.13,<2", "pre-commit>=4,<5"]

[tool.hatch.metadata]
allow-direct-references = true  # tallymap from its git commit

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.hatch.build.targets.sdist]
# the package only: installs come from the repository (whose tests read examples/ and tools/)
only-include = ["src", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "tools"]
# Python only, even for files named on the command line: the package's data (JSON, GDML) is never reformatted
force-exclude = true
extend-exclude = ["*.json", "*.gdml", "*.toml", "*.md", "*.txt", "*.yaml", "*.yml", "*.npy", "*.npz", "*.csv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "ICN", "D", "C901", "PLR0912", "PLR0913", "PLR0915", "TID251", "T20",
          "PGH004", "RUF100"]
# N806: short uppercase math names (R, T, Es) are allowed inside a function whose docstring has a Notation line
# (docs/dev/style.md, rule 1); ruff cannot see the Notation line, so review enforces it.
ignore = ["N806"]

[tool.ruff.lint.per-file-ignores]
"src/lumen/_env.py" = ["TID251"]
# B023: the tests and tools build closures over loop variables and call them at once, inside the loop
"tests/**" = ["D", "T20", "B023", "N803", "PLR0913", "PLR0915"]
"tools/**" = ["D", "T20", "TID251", "B023", "PLR0912", "PLR0913", "PLR0915", "C901"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Read the environment only in lumen._env (docs/dev/style.md, rule 8)."
"os.getenv".msg = "Read the environment only in lumen._env (docs/dev/style.md, rule 8)."

[tool.ruff.lint.isort]
known-first-party = ["lumen"]

[tool.mypy]
# Host-side code only (docs/dev/style.md): device code is annotated with jax.Array and checked by its tests.
python_version = "3.10"
files = ["src/lumen/_env.py", "src/lumen/_cache.py", "src/lumen/format", "src/lumen/gdml", "src/lumen/params.py",
         "src/lumen/models.py"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["lumen._env", "lumen._cache"]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
# a bare pytest runs the unit tier (CPU); the physics tier is run by name (pytest tests/physics) on a GPU
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: needs a GPU (the physics tier; skipped without one)",
    "slow: minutes on a CPU; not run on GitHub (pytest -m 'not slow'), run by tools/ci/gpu.sh",
]
