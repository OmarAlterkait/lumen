# Every hook is local and runs from lumen's development environment (ruff, mypy, pre-commit), so nothing is fetched at
# commit time. Install with:  pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: local
    hooks:
      - id: privacy-guard
        name: privacy guard (staged content and paths)
        entry: python tools/hooks/privacy_guard.py staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: privacy-guard-message
        name: privacy guard (commit message)
        entry: python tools/hooks/privacy_guard.py message
        language: system
        stages: [commit-msg]
      - id: privacy-guard-push
        name: privacy guard (every outgoing commit, its blobs and archives, and the ref names)
        entry: tools/hooks/pre_push.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        stages: [pre-commit]
      - id: mypy
        name: mypy (host-side code)
        entry: mypy
        language: system
        pass_filenames: false
        files: ^src/lumen/
        types: [python]
        stages: [pre-commit]
      - id: constants-lint
        name: constants lint (no bare number in src/lumen outside rules/choices.py, rules/tolerances.py, units.py)
        entry: python tools/lint/constants.py
        language: system
        pass_filenames: false
        files: ^(src/lumen/|tools/lint/)
        stages: [pre-commit]
      - id: no-site-paths
        name: no absolute paths outside the repository or Slurm accounts in src/, tests/, tools/ or examples/ (style rule 9)
        # an absolute path whose first component is not a system directory, or a Slurm account, partition or QOS
        entry: '(^|[\s"''=(`])/(?!dev/|tmp\b|usr/|etc/|proc/|sys/|app/|bin/|opt/|path/|jax/|x/|nowhere/)[A-Za-z_][\w.-]*/|--(account|partition|qos)[ =][a-z]'
        language: pygrep
        files: ^(src|tests|tools|examples)/
        exclude: (\.cc|\.min\.js)$  # C++: Geant4's UI commands ("/run/verbose"), three.js: regular expressions
        stages: [pre-commit]
